<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="@@DESCRIPTION@@">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#141019">
  <title>@@TITLE@@ | 식탁보 카탈로그</title>
  <link rel="canonical" href="https://catalog.yourtablecloth.app@@PATH@@">
  <link rel="icon" type="image/svg+xml" href="/assets/tablecloth.svg">
  <script>
    (() => {
      let saved;
      try { saved = localStorage.getItem("tc.theme"); } catch {}
      const prefersLight = typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: light)").matches;
      const theme = saved === "light" || saved === "dark" ? saved : prefersLight ? "light" : "dark";
      document.documentElement.dataset.theme = theme;
      document.documentElement.classList.toggle("light", theme === "light");
      document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#efe7da" : "#141019";
    })();
  </script>
  <link rel="stylesheet" href="/assets/catalog.css">
  <script src="/assets/catalog.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-group">
        <a class="brand" href="https://yourtablecloth.app/" aria-label="식탁보 공식 사이트"><img src="/assets/tablecloth.svg" alt="" aria-hidden="true" width="26" height="26"><span>식탁보®</span></a>
        <span class="brand-divider" aria-hidden="true">/</span>
        <a class="brand-section" href="/" aria-label="식탁보 카탈로그 홈">카탈로그</a>
      </div>
      <nav aria-label="주요 메뉴">
        <a href="/" @@SITES_CURRENT@@>사이트</a>
        <a href="/skills/" @@SKILLS_CURRENT@@>스킬 마켓플레이스</a>
        <a href="#contribute">기여 안내</a>
        <a href="https://yourtablecloth.app/" class="app-link">식탁보 홈 <span aria-hidden="true">↗</span></a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle hidden aria-label="밝은 화면으로 전환">
        <svg class="theme-sun" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.5"/><path d="M10 1v2m0 14v2M1 10h2m14 0h2M3.6 3.6 5 5m10 10 1.4 1.4M3.6 16.4 5 15M15 5l1.4-1.4"/></svg>
        <svg class="theme-moon" aria-hidden="true" focusable="false" width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 11.2A7.7 7.7 0 0 1 8.8 2.5a7.7 7.7 0 1 0 8.7 8.7Z"/></svg>
        <span data-theme-label>밝은 화면</span>
      </button>
    </div>
  </header>
  <main id="main" tabindex="-1">@@CONTENT@@</main>
  <footer class="site-footer">
    <div class="footer-intro"><a class="footer-brand" href="https://yourtablecloth.app/"><img src="/assets/tablecloth.svg" alt="" aria-hidden="true" width="32" height="32"><span>TableCloth®</span></a><p>사이트 정보와 스킬 원본을 함께 살펴볼 수 있습니다.</p></div>
    <div class="footer-links"><a href="https://yourtablecloth.app/">식탁보 홈</a><a href="/">사이트 카탈로그</a><a href="/skills/">스킬 마켓플레이스</a><a href="/Catalog.xml">사이트 XML</a><a href="/SkillCatalog.xml">스킬 XML</a><a href="https://github.com/yourtablecloth/TableClothCatalog">GitHub</a><a href="https://github.com/yourtablecloth/TableClothCatalog/blob/main/NOTICE.md">고지</a><a href="https://github.com/yourtablecloth/TableClothCatalog/blob/main/TRADEMARKS.md">상표 안내</a></div>
    <div class="fine-print"><p>카탈로그 수록은 제공사와의 제휴나 개별 설치 및 실행 검증을 뜻하지 않습니다. 제3자 이름과 로고의 권리는 각 권리자에게 있습니다.</p><p>식탁보 이름과 로고의 권리는 rkttu.com에 있습니다.</p><p>글꼴 라이선스: <a href="/assets/licenses/Pretendard-OFL.txt">Pretendard</a>, <a href="/assets/licenses/JetBrainsMono-OFL.txt">JetBrains Mono</a></p></div>
  </footer>
</body>
</html>
